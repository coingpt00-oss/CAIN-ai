name: Fetch BBB Top100

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 실행

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -V
          pip -V
          pip install --upgrade pip
          pip install requests supabase ccxt

      # ✅ 어디 Supabase로 쏘는지 / secrets가 들어있는지 "안전하게" 확인
      - name: Debug Supabase target (safe)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail

          echo "=== DEBUG: Supabase target ==="
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::SUPABASE_URL secret is missing/empty"
            exit 1
          fi
          if [ -z "${SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY secret is missing/empty"
            exit 1
          fi

          # URL은 표시 (프로젝트 확인용)
          echo "SUPABASE_URL=${SUPABASE_URL}"

          # KEY는 길이만 표시 (유출 방지)
          echo "SUPABASE_SERVICE_ROLE_KEY length=${#SUPABASE_SERVICE_ROLE_KEY}"

          # 호스트만 뽑아서 표시 (프로젝트가 맞는지 직관적으로)
          HOST=$(echo "$SUPABASE_URL" | sed -E 's#https?://##' | cut -d/ -f1)
          echo "SUPABASE_HOST=${HOST}"
          echo "=============================="

      # ✅ 실제 스크립트 실행 (출력 즉시 flush)
      - name: Run fetch script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          python scripts/fetch_bbb_top100.py
